[workspace]
rust = "rust"
zed = "zed-rust"
analyzer = "rust/src/tools/rust-analyzer"
stress_project = "zed-rust/rust-ownership-stress-lab"

[application]
name = "Rust Workbench"
app_id = "dev.rustworkbench.EditorDev"
release_channel = "dev"
install_directory = "rust-workbench"
install_layout_version = 1

[compatibility]
os = "linux"
arch = "x86_64"
rust_host = "x86_64-unknown-linux-gnu"
native_triple = "x86_64-linux-gnu"
glibc_min = "2.43"

[prerequisites]
host_packages = [
  "apt",
  "binutils",
  "build-essential",
  "ca-certificates",
  "cmake",
  "curl",
  "dpkg",
  "git",
  "ninja-build",
  "pkg-config",
  "python3",
  "tar",
  "util-linux",
  "zstd",
]
runtime_packages = [
  "bash",
  "coreutils-from-uutils",
  "desktop-file-utils",
  "libc-bin",
  "libvulkan1",
  "sed",
  "util-linux",
]
vm_packages = [
  "cloud-image-utils",
  "openssh-client",
  "qemu-system-x86",
  "qemu-utils",
]

[cleanup]
debug_caches = [
  "zed-rust/target/debug",
  "rust/src/tools/rust-analyzer/target/debug",
  "zed-rust/build",
]
all_generated = [
  "zed-rust/target/debug",
  "rust/src/tools/rust-analyzer/target/debug",
  "zed-rust/build",
  "zed-rust/rust-workbench-analysis-target",
  "zed-rust/rust-workbench-data/cache",
  "dist",
]

[native_sdk]
gcc_major = "15"
packages = [
  "gcc-15",
  "gcc-15-x86-64-linux-gnu",
  "g++-15",
  "g++-15-x86-64-linux-gnu",
  "cpp-15",
  "cpp-15-x86-64-linux-gnu",
  "binutils",
  "binutils-common",
  "binutils-x86-64-linux-gnu",
  "libbinutils",
  "libctf0",
  "libctf-nobfd0",
  "libgprofng0",
  "libsframe3",
  "gcc-15-base",
  "libgcc-s1",
  "libstdc++6",
  "libatomic1",
  "libasan8",
  "libtsan2",
  "libgomp1",
  "libquadmath0",
  "libhwasan0",
  "libubsan1",
  "liblsan0",
  "libitm1",
  "libcc1-0",
  "libgcc-15-dev",
  "libstdc++-15-dev",
  "libc6-dev",
  "linux-libc-dev",
  "libc6",
]
